<svg width="100%" viewBox="0 0 720 490" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Atlas A1 Operating Modes</title>
  <desc>Sơ đồ chuyển trạng thái của Atlas A1: Idle, Mapping, Incremental Mapping, Navigation</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="490" fill="rgb(250,250,248)" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="rgb(30,30,28)">Các chế độ hoạt động — Atlas A1</text>

  <!-- ── INITIAL INDICATOR ── -->
  <circle cx="360" cy="58" r="10" fill="rgb(30,30,28)"/>
  <line x1="360" y1="68" x2="360" y2="88" stroke="rgb(115,114,108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="64" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="rgb(95,94,90)">Khởi động</text>

  <!-- ── IDLE STATE (center-top) ── -->
  <g onclick="sendPrompt('Trạng thái Idle của Atlas A1 có nghĩa là gì?')">
    <rect x="270" y="88" width="180" height="60" rx="10" fill="rgb(230,241,251)" stroke="rgb(24,95,165)" stroke-width="1.5"/>
    <text x="360" y="113" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="rgb(12,68,124)">Idle</text>
    <text x="360" y="131" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="rgb(24,95,165)">mode = 0  ·  Tất cả dừng</text>
  </g>

  <!-- ── MAPPING (bottom-left) ── -->
  <g onclick="sendPrompt('Chế độ Mapping của Atlas A1 hoạt động như thế nào?')">
    <rect x="28" y="288" width="172" height="76" rx="10" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="1.5"/>
    <text x="114" y="315" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="rgb(8,80,65)">Mapping</text>
    <text x="114" y="333" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="rgb(15,110,86)">mode = 1</text>
    <text x="114" y="351" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="rgb(15,110,86)">slam_toolbox (fresh)</text>
  </g>

  <!-- ── INCREMENTAL MAPPING (bottom-center) ── -->
  <g onclick="sendPrompt('Incremental Mapping của Atlas A1 dùng posegraph như thế nào?')">
    <rect x="234" y="288" width="192" height="76" rx="10" fill="rgb(245,240,255)" stroke="rgb(109,40,217)" stroke-width="1.5"/>
    <text x="330" y="315" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="rgb(76,29,149)">Incr. Mapping</text>
    <text x="330" y="333" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="rgb(109,40,217)">mode = 3</text>
    <text x="330" y="351" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="rgb(109,40,217)">Load posegraph</text>
  </g>

  <!-- ── NAVIGATION (bottom-right) ── -->
  <g onclick="sendPrompt('Chế độ Navigation của Atlas A1 dùng Nav2 stack như thế nào?')">
    <rect x="460" y="278" width="232" height="96" rx="10" fill="rgb(255,247,219)" stroke="rgb(146,108,10)" stroke-width="1.5"/>
    <text x="576" y="305" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="rgb(107,78,7)">Navigation</text>
    <text x="576" y="323" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="rgb(146,108,10)">mode = 2</text>
    <text x="576" y="341" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="rgb(146,108,10)">map_server + localization</text>
    <text x="576" y="357" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="rgb(146,108,10)">+ full Nav2 stack</text>
  </g>

  <!-- ── ARROWS: Idle → Mapping ── -->
  <line x1="298" y1="148" x2="164" y2="288" stroke="rgb(15,110,86)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="180" y="196" width="72" height="18" rx="4" fill="rgb(240,253,244)"/>
  <text x="216" y="209" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="rgb(15,110,86)">mode = 1</text>

  <!-- ── ARROWS: Mapping → Idle ── -->
  <line x1="130" y1="288" x2="292" y2="148" stroke="rgb(115,114,108)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="138" y="220" width="72" height="18" rx="4" fill="rgb(248,248,246)"/>
  <text x="174" y="233" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="rgb(95,94,90)">mode = 0</text>

  <!-- ── ARROWS: Idle → IncrMapping ── -->
  <line x1="348" y1="148" x2="336" y2="288" stroke="rgb(109,40,217)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="208" width="72" height="18" rx="4" fill="rgb(250,245,255)"/>
  <text x="386" y="221" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="rgb(109,40,217)">mode = 3</text>

  <!-- ── ARROWS: IncrMapping → Idle ── -->
  <line x1="322" y1="288" x2="346" y2="148" stroke="rgb(115,114,108)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ── ARROWS: Idle → Navigation ── -->
  <line x1="422" y1="148" x2="530" y2="278" stroke="rgb(146,108,10)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="450" y="194" width="72" height="18" rx="4" fill="rgb(255,252,235)"/>
  <text x="486" y="207" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="rgb(146,108,10)">mode = 2</text>

  <!-- ── ARROWS: Navigation → Idle ── -->
  <line x1="546" y1="278" x2="426" y2="148" stroke="rgb(115,114,108)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="470" y="226" width="72" height="18" rx="4" fill="rgb(248,248,246)"/>
  <text x="506" y="239" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="rgb(95,94,90)">mode = 0</text>

  <!-- ── ARROWS: Mapping → Navigation (Save Map) ── -->
  <path d="M 200 364 Q 200 440 576 440 Q 692 440 692 374" fill="none" stroke="rgb(146,108,10)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <rect x="326" y="430" width="96" height="18" rx="4" fill="rgb(255,252,235)"/>
  <text x="374" y="443" text-anchor="middle" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="rgb(146,108,10)">Save Map → mode=2</text>

  <!-- ── ARROWS: IncrMapping → Navigation (Save Map) ── -->
  <line x1="426" y1="330" x2="460" y2="326" stroke="rgb(146,108,10)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- ── LEGEND ── -->
  <rect x="18" y="462" width="684" height="22" rx="4" fill="rgb(241,239,232)"/>
  <line x1="40" y1="473" x2="65" y2="473" stroke="rgb(15,110,86)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="68" y="477" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="rgb(68,68,65)">Chuyển mode</text>
  <line x1="160" y1="473" x2="185" y2="473" stroke="rgb(115,114,108)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="188" y="477" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="rgb(68,68,65)">Quay về Idle (mode=0)</text>
  <line x1="340" y1="473" x2="365" y2="473" stroke="rgb(146,108,10)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="368" y="477" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="rgb(68,68,65)">Save Map → Navigation</text>
  <text x="560" y="477" font-family="'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="rgb(95,94,90)">Bui Quoc Doanh</text>
</svg>
